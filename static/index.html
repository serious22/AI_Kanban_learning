<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Kanban</title>
<style>
:root{
  --bg:#f4f3ef; --col:#ebe9e3; --card:#ffffff; --ink:#1c1c1a; --muted:#6c6a63; --line:#dedbd3;
  --accent:#2f5bd3; --accent-soft:#e7edfc; --ai:#7a4fd6; --ai-soft:#efe8fc;
  --ok:#2e7d4f; --ok-soft:#e3f2e8; --warn:#b7791f; --warn-soft:#fbf0d9; --bad:#c0392b; --bad-soft:#fbe7e4;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121211; --col:#1b1b19; --card:#232321; --ink:#ebeae5; --muted:#a19f98; --line:#34332f;
    --accent:#86a3f5; --accent-soft:#222a3d; --ai:#b39af5; --ai-soft:#2b2340;
    --ok:#6cc596; --ok-soft:#1d2e24; --warn:#e3a84a; --warn-soft:#3a2f1a; --bad:#ef7a6c; --bad-soft:#3a201c;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:1.15rem;margin:0 8px 0 0}
header .sub{color:var(--muted);font-size:.85rem}
.grow{flex:1}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 13px;border-radius:9px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.danger{color:var(--bad)}
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;padding:16px 18px;height:calc(100% - 64px);overflow-x:auto}
.col{background:var(--col);border-radius:14px;display:flex;flex-direction:column;min-height:0}
.col-h{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;font-weight:700}
.col-h .count{font-weight:600;font-size:.78rem;color:var(--muted);background:var(--card);border-radius:999px;padding:1px 8px}
.col-h .hint{margin-left:auto;font-weight:500;font-size:.72rem;color:var(--muted)}
.col[data-col=in_progress] .col-h{color:var(--ai)}
.col[data-col=human_qa] .col-h{color:var(--warn)}
.col[data-col=completed] .col-h{color:var(--ok)}
.list{flex:1;overflow-y:auto;padding:4px 10px 14px;display:flex;flex-direction:column;gap:8px;min-height:60px;border-radius:0 0 14px 14px;transition:background .15s}
.list.over{background:var(--accent-soft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 12px;box-shadow:var(--shadow);cursor:grab;user-select:none}
.card:hover{border-color:var(--accent)}
.card.dragging{opacity:.4}
.card.locked{cursor:not-allowed}
.card .t{font-weight:600;line-height:1.35}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;align-items:center}
.pill{font-size:.72rem;padding:1px 7px;border-radius:999px;background:var(--col);color:var(--muted)}
.pill.ai{background:var(--ai-soft);color:var(--ai);font-weight:600}
.pill.err{background:var(--bad-soft);color:var(--bad);font-weight:600}
.pill.src{background:var(--accent-soft);color:var(--accent)}
.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ai);margin-right:4px;animation:p 1s infinite}
@keyframes p{50%{opacity:.25}}
.reason{font-size:.78rem;color:var(--muted);margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.empty{color:var(--muted);font-size:.82rem;text-align:center;padding:14px 4px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .15s;z-index:10}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(520px,100%);background:var(--card);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .18s;z-index:11;display:flex;flex-direction:column}
.drawer.open{transform:none}
.d-h{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.d-b{flex:1;overflow-y:auto;padding:16px}
.d-b label{display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 4px;font-weight:600}
.d-b input,.d-b textarea,.d-b select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px}
.d-b textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.comments{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.cm{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg)}
.cm .who{font-size:.75rem;font-weight:700}
.cm .who span{font-weight:500;color:var(--muted);margin-left:6px}
.cm.AI{border-color:var(--ai-soft)} .cm.AI .who{color:var(--ai)}
.cm.system{background:var(--col)} .cm.system .who{color:var(--muted)}
.cm .tx{white-space:pre-wrap;font-size:.9rem;margin-top:2px}
.result{border:1px solid var(--ok-soft);background:var(--ok-soft);border-radius:10px;padding:10px;white-space:pre-wrap;font-size:.88rem}
.kbd{font-size:.72rem;color:var(--muted)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:9px;font-size:.88rem;opacity:0;transition:opacity .2s;z-index:20;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:760px){ .board{grid-template-columns:repeat(4,82vw);height:auto} }
</style>
</head>
<body>
<header>
  <h1>AI Kanban</h1>
  <span class="sub">Drag a card to <b>In-Progress</b> to hand it to the agent</span>
  <span class="grow"></span>
  <button class="btn" id="intake" title="Run today's intake now (recurring.json + inbox/notes.txt)">Run daily intake</button>
  <button class="btn primary" id="new">+ New card</button>
</header>

<div class="board" id="board"></div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Card details">
  <div class="d-h">
    <strong id="d-title">Card</strong>
    <span class="grow"></span>
    <button class="btn danger" id="d-del">Delete</button>
    <button class="btn" id="d-close">✕</button>
  </div>
  <div class="d-b">
    <label>Title</label><input id="f-title">
    <label>Description</label><textarea id="f-desc" placeholder="What needs to be done"></textarea>
    <div class="row">
      <div style="flex:1"><label>Task type</label>
        <select id="f-type">
          <option value="">general</option><option>research</option><option>writing</option>
          <option>outreach</option><option>ops</option><option>pricing</option><option>other</option>
        </select></div>
      <div style="flex:1"><label>Labels (comma-separated)</label><input id="f-labels" placeholder="e.g. auto-send-ok"></div>
    </div>
    <div class="row" style="margin-top:10px"><button class="btn primary" id="f-save">Save</button><span class="kbd" id="f-status"></span></div>

    <div id="result-wrap" hidden><label>Agent deliverable</label><div class="result" id="result"></div></div>

    <label>Comments / prompts for the agent</label>
    <div class="comments" id="comments"></div>
    <textarea id="c-text" placeholder="Tell the agent what to do. Add as many as you like. (⌘/Ctrl + Enter to post)" style="margin-top:8px"></textarea>
    <div class="row" style="margin-top:6px"><button class="btn primary" id="c-post">Add comment</button></div>
  </div>
</aside>
<div class="toast" id="toast"></div>

<script>
const COLS = [["items","Items","drop new work here"],["in_progress","In-Progress","AI works here"],["human_qa","Human QA","your review"],["completed","Completed",""]];
const $ = id => document.getElementById(id);
let cards = [], openId = null, dragId = null, lastSig = "";

const esc = s => (s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const when = iso => new Date(iso.slice(0,19) + "Z").toLocaleString([], {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"});
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200); }

async function api(path, opts={}){
  const r = await fetch(path, {headers:{"Content-Type":"application/json"}, ...opts});
  if(!r.ok){ let m = r.statusText; try{ m = (await r.json()).detail || m }catch{}; throw new Error(m); }
  return r.status === 204 ? null : r.json();
}

async function load(){
  try{
    const data = await api("/api/cards");
    const sig = JSON.stringify(data);
    if(sig !== lastSig){ lastSig = sig; cards = data; render(); if(openId) fillDrawer(false); }
  }catch(e){ console.error(e); }
}

function render(){
  const b = $("board"); b.innerHTML = "";
  for(const [key,label,hint] of COLS){
    const list = cards.filter(c => c.column === key);
    const col = document.createElement("section");
    col.className = "col"; col.dataset.col = key;
    col.innerHTML = `<div class="col-h">${label}<span class="count">${list.length}</span><span class="hint">${hint}</span></div><div class="list" data-col="${key}"></div>`;
    const ul = col.querySelector(".list");
    if(!list.length) ul.innerHTML = `<div class="empty">No cards</div>`;
    for(const c of list) ul.appendChild(cardEl(c));
    wireDrop(ul);
    b.appendChild(col);
  }
}

function cardEl(c){
  const el = document.createElement("div");
  const busy = c.ai_status === "queued" || c.ai_status === "running";
  el.className = "card" + (busy ? " locked" : "");
  el.draggable = !busy; el.dataset.id = c.id;
  const status = busy ? `<span class="pill ai"><span class="pulse"></span>${c.ai_status === "queued" ? "queued" : "AI working"}</span>`
               : c.ai_status === "error" ? `<span class="pill err">error</span>` : "";
  const src = c.source !== "manual" ? `<span class="pill src">${esc(c.source)}</span>` : "";
  const type = c.task_type ? `<span class="pill">${esc(c.task_type)}</span>` : "";
  const labels = (c.labels||[]).map(l => `<span class="pill">#${esc(l)}</span>`).join("");
  const n = c.comments.filter(x => x.author !== "system").length;
  const reason = (c.column === "human_qa" || c.column === "completed") && c.ai_reason ? `<div class="reason">${esc(c.ai_reason)}</div>` : "";
  el.innerHTML = `<div class="t">${esc(c.title)}</div><div class="meta">${status}${type}${src}${labels}<span class="pill">💬 ${n}</span></div>${reason}`;
  el.addEventListener("click", () => openDrawer(c.id));
  el.addEventListener("dragstart", e => { if(busy){ e.preventDefault(); return; } dragId = c.id; el.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; });
  el.addEventListener("dragend", () => { el.classList.remove("dragging"); dragId = null; });
  return el;
}

function wireDrop(list){
  list.addEventListener("dragover", e => { e.preventDefault(); list.classList.add("over"); });
  list.addEventListener("dragleave", () => list.classList.remove("over"));
  list.addEventListener("drop", async e => {
    e.preventDefault(); list.classList.remove("over");
    if(dragId == null) return;
    const id = dragId, to = list.dataset.col;
    // position: midpoint between neighbours under the cursor (simple ordering)
    const others = [...list.querySelectorAll(".card")].filter(x => +x.dataset.id !== id);
    const after = others.find(x => e.clientY < x.getBoundingClientRect().top + x.offsetHeight/2);
    const idx = after ? others.indexOf(after) : others.length;
    const card = cards.find(c => c.id === id); const from = card.column;
    card.column = to; if(to === "in_progress" && from !== "in_progress") card.ai_status = "queued";
    render();
    try{
      await api(`/api/cards/${id}/move`, {method:"POST", body: JSON.stringify({column: to, index: idx})});
      if(to === "in_progress" && from !== "in_progress") toast("Handed to the agent");
    }catch(err){ toast(err.message); }
    lastSig = ""; load();
  });
}

function openDrawer(id){ openId = id; fillDrawer(true); $("drawer").classList.add("open"); $("scrim").classList.add("open"); }
function closeDrawer(){ openId = null; $("drawer").classList.remove("open"); $("scrim").classList.remove("open"); }

function fillDrawer(full){
  const c = cards.find(x => x.id === openId); if(!c){ closeDrawer(); return; }
  $("d-title").textContent = `#${c.id} · ${COLS.find(x=>x[0]===c.column)[1]}`;
  if(full){
    $("f-title").value = c.title; $("f-desc").value = c.description;
    $("f-type").value = c.task_type || ""; $("f-labels").value = (c.labels||[]).join(", ");
    $("f-status").textContent = ""; $("c-text").value = "";
  }
  const res = c.result && c.result.deliverable;
  $("result-wrap").hidden = !res; $("result").textContent = res || "";
  $("comments").innerHTML = c.comments.length ? c.comments.map(m =>
    `<div class="cm ${esc(m.author)}"><div class="who">${esc(m.author)}<span>${when(m.created_at)}</span></div><div class="tx">${esc(m.text)}</div></div>`).join("")
    : `<div class="empty">No comments yet. Add the prompt for the agent here.</div>`;
}

async function saveCard(){
  const labels = $("f-labels").value.split(",").map(s=>s.trim()).filter(Boolean);
  try{
    await api(`/api/cards/${openId}`, {method:"PATCH", body: JSON.stringify({title:$("f-title").value, description:$("f-desc").value, task_type:$("f-type").value || null, labels})});
    $("f-status").textContent = "Saved ✓"; lastSig = ""; load();
  }catch(e){ toast(e.message); }
}
async function postComment(){
  const text = $("c-text").value.trim(); if(!text) return;
  try{ await api(`/api/cards/${openId}/comments`, {method:"POST", body: JSON.stringify({text})}); $("c-text").value = ""; lastSig = ""; await load(); }
  catch(e){ toast(e.message); }
}

$("new").onclick = async () => {
  const title = prompt("Card title"); if(!title || !title.trim()) return;
  try{ const c = await api("/api/cards", {method:"POST", body: JSON.stringify({title})}); lastSig=""; await load(); openDrawer(c.id); }
  catch(e){ toast(e.message); }
};
$("intake").onclick = async () => {
  try{ const r = await api("/api/intake/run", {method:"POST"}); toast(`Intake: ${r.recurring.length} recurring · notes: ${r.notes.status}`); lastSig=""; load(); }
  catch(e){ toast(e.message); }
};
$("d-close").onclick = closeDrawer; $("scrim").onclick = closeDrawer;
$("d-del").onclick = async () => { if(!confirm("Delete this card?")) return; try{ await api(`/api/cards/${openId}`, {method:"DELETE"}); closeDrawer(); lastSig=""; load(); }catch(e){ toast(e.message); } };
$("f-save").onclick = saveCard; $("c-post").onclick = postComment;
$("c-text").addEventListener("keydown", e => { if(e.key === "Enter" && (e.metaKey || e.ctrlKey)) postComment(); });
document.addEventListener("keydown", e => { if(e.key === "Escape") closeDrawer(); });

load(); setInterval(load, 3000);   // poll: the agent runs in the background
</script>
</body>
</html>
